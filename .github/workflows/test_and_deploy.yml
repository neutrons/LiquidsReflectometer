name: Tests, Packaging, and Deployment

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [exp-next, exp-qa, exp]
    tags: ["exp[0-9]*"] # exp3.0, exp3.0rc1, ...; versioningit strips the exp prefix

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG_NAME: lr_reduction

jobs:
  #################
  ### Run Tests ###
  #################

  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for accurate versioning
          fetch-tags: true # Fetch tags to ensure versioning works correctly

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          manifest-path: pyproject.toml

      - name: Configure Git credentials for code.ornl.gov
        # Dependabot has no access to the data repository token
        if: github.actor != 'dependabot[bot]'
        env:
          TOKEN: ${{ secrets.DATA_READ_TOKEN }}
        run: |
          git config --global url."https://gitlab-ci-token:${TOKEN}@code.ornl.gov/".insteadOf "https://code.ornl.gov/"

      - name: Download test data
        if: github.actor != 'dependabot[bot]'
        run: |
          git submodule update --init
          git submodule foreach --recursive git lfs pull
          echo "data repo size: $(du -sh tests/data/liquidsreflectometer-data)"

      - name: Test with coverage
        env:
          # Dependabot runs without the test data, so skip the tests that need it
          PYTEST_MARKERS: ${{ github.actor == 'dependabot[bot]' && 'not datarepo' || '' }}
        run: |
          pixi run test-reduction -m "$PYTEST_MARKERS"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.actor != 'dependabot[bot]'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build documentation
        run: |
          pixi run docs-build --environment docs
          test -f ./docs/build/html/index.html

  ##############################
  ### Package and Deployment ###
  ##############################

  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for accurate versioning
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Build conda package
        run: |
          pixi run conda-build

          # Stage the package in a local channel layout for pkg-install, which indexes it.
          mkdir -p local-channel/noarch
          cp *.conda local-channel/noarch/

      # pkg-verify requires a conda env that already has the package
      # installed (and micromamba on PATH); pkg-install sets both up.
      - name: Install built conda package
        id: install
        uses: neutrons/gh-actions/pkg-install@eb7a7c6fcfd0cda1a7b238329afc0afd09a4f4af # v2
        with:
          package-name: ${{ env.PKG_NAME }}
          local-channel: ./local-channel
          extra-channels: neutrons mantid

      - name: Verify Conda Package
        uses: neutrons/gh-actions/pkg-verify@eb7a7c6fcfd0cda1a7b238329afc0afd09a4f4af # v2
        with:
          package-name: ${{ env.PKG_NAME }}
          conda-env-name: ${{ steps.install.outputs.conda-env }}
          extra-commands: |
            python -c "import lr_reduction"
            python -c "import lr_autoreduce"
            python -c "import mantid"

      - name: upload conda package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-conda-package
          path: ${{ env.PKG_NAME }}-*.conda

  publish:
    runs-on: ubuntu-24.04
    needs: [build]
    # every push to exp-next publishes; exp-qa and exp publish only on tags
    if: startsWith(github.ref, 'refs/tags/exp') || github.ref == 'refs/heads/exp-next'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0 # full history so the label step can test branch ancestry

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Determine conda label
        id: label
        run: |
          set -euo pipefail
          label=""
          case "${GITHUB_REF}" in
            refs/heads/exp-next) label="exp-next" ;;
            refs/tags/exp[0-9]*rc*) label="exp-qa" ;; # release candidate, same convention as qa upstream
            refs/tags/exp[0-9]*)    label="exp" ;;    # release, same convention as main upstream
          esac
          if [ -z "${label}" ]; then
            echo "::error::cannot derive a conda label from ${GITHUB_REF}"
            exit 1
          fi
          # A tag push carries no branch name, so confirm the tagged commit really is
          # on the branch the tag name implies. HEAD is used instead of github.sha
          # because they differ for annotated tags.
          if ! git merge-base --is-ancestor HEAD "origin/${label}"; then
            echo "::error::${GITHUB_REF} is not on branch ${label}; refusing to publish under label '${label}'"
            exit 1
          fi
          echo "Publishing ${GITHUB_REF} under label '${label}'"
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Download conda package artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-conda-package

      - name: Upload package to anaconda
        uses: neutrons/gh-actions/publish@eb7a7c6fcfd0cda1a7b238329afc0afd09a4f4af # v2
        with:
          anaconda-token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutrons
          package-path: ${{ env.PKG_NAME }}-*.conda
          label: ${{ steps.label.outputs.label }}

      - name: Remove old packages
        if: steps.label.outputs.label == 'exp-next'
        uses: neutrons/gh-actions/pkg-remove@eb7a7c6fcfd0cda1a7b238329afc0afd09a4f4af # v2
        with:
          anaconda-token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutrons
          package-name: ${{ env.PKG_NAME }}
          label: ${{ steps.label.outputs.label }}
          keep: 5

  # Trigger GitLab dev deploy pipeline
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [tests, build]
    if: github.ref == 'refs/heads/next'
    steps:
      - name: Get Environment Name
        uses: neutrons/gh-actions/branch-mapper@eb7a7c6fcfd0cda1a7b238329afc0afd09a4f4af # v2
        id: env_name
        with:
          prefix: lr_reduction

      - name: Trigger Dev Deploy
        uses: eic/trigger-gitlab-ci@v3.3
        id: trigger
        with:
          url: https://code.ornl.gov
          project_id: 19884
          ref_name: main
          token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      - name: Annotate commit
        uses: peter-evans/commit-comment@v4
        with:
          body: |
            GitLab pipeline for ${{ steps.env_name.outputs.name }} has been submitted for this commit: ${{ steps.trigger.outputs.web_url }}

  # Trigger GitLab exp-next deploy pipeline
  deploy-exp-next:
    runs-on: ubuntu-latest
    needs: [build, publish]
    if: github.ref == 'refs/heads/exp-next'
    steps:
      - name: Trigger Exp Deploy
        uses: eic/trigger-gitlab-ci@v3.3
        id: trigger
        with:
          url: https://code.ornl.gov
          project_id: 21175
          ref_name: main
          token: ${{ secrets.GITLAB_EXP_DEPLOY_TOKEN }}

      - name: Annotate commit
        uses: peter-evans/commit-comment@v4
        with:
          body: |
            GitLab pipeline for lr_reduction-exp has been submitted for this commit: ${{ steps.trigger.outputs.web_url }}
