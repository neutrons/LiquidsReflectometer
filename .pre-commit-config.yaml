default_install_hook_types: [pre-commit, pre-push]

ci:
  autofix_prs: true
  skip: [pixi-lock-check]

exclude: "(reduction/data|reduction/notebooks|scripts|scans)/.*"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=4096]
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: "tests/data/.*"
      - id: trailing-whitespace
        exclude: "tests/data/.*"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --extend-select, RUF100]
        types_or: [python, pyi, jupyter]
        # frozen legacy-reduction files (PR #219 review, 2026-10-20), and the template system's two
        # (2026-10-21): upstream's content, not linted
        # lint through `pre-commit run ruff-check --all-files`; `ruff check .` by hand reports the frozen files' findings
        # drop an entry when the file is next intentionally changed or deleted
        # (background, dead_time_correction, output and peak_finding left with their warnings fixes)
        exclude: |
          (?x)^(
            tests/data/.*|
            launcher/apps/roi_selector\.py|
            launcher/scripts/off_spec\.py|
            launcher/scripts/quick_reduce\.py|
            launcher/scripts/refracted_beam\.py|
            launcher/scripts/xrr_reduction\.py|
            src/lr_reduction/new_reduction_from_template\.py|
            src/lr_reduction/new_reduction_template_reader\.py|
            src/lr_reduction/reduction_template_reader\.py|
            src/lr_reduction/template\.py|
            src/lr_reduction/time_resolved\.py
          )$
  - repo: local
    hooks:
      - id: pixi-lock-format
        name: pixi-lock-format (lock stays v6 — analysis.sns.gov pixi < 0.68)
        entry: bash scripts/check_lock_format.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: pixi-lock-check
        name: pixi-lock-check
        entry: bash scripts/pixi_lock_check.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
