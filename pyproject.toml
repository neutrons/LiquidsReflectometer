[project]
name = "lr_reduction"
authors = [{ name = "Mat", email = "m2d@ornl.gov" }]
description = "Reduction backend for the Liquids Reflectometer."
keywords = ["neutrons", "reflectometry", "reduction"]
dynamic = ["version"]
license-files = [ "LICENSE" ]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
homepage = "https://github.com/neutrons/LiquidsReflectometer"
repository = "https://github.com/neutrons/LiquidsReflectometer"
documentation = "https://lr-reduction.readthedocs.io/latest/index.html"

[project.gui-scripts]
launcher = "launcher.launcher:main"
new_launcher = "launcher.new_launcher:main"

#####################################
#  BUILDING FROM SOURCES WITH HATCH
#####################################
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27.0", "toml", "versioningit"]


[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "src/lr_reduction/_version.py"
build-file = "lr_reduction/_version.py"

[tool.hatch.build]
artifacts = [
  "src/lr_reduction/_version.py",
  "src/lr_reduction/**/*.yml",
  "src/lr_reduction/**/*.yaml",
  "src/lr_reduction/**/*.ini"
]

[tool.hatch.build.targets.wheel]
packages = ["src/lr_reduction", "src/lr_autoreduce", "launcher"]

#################
#  VERSIONINGIT
#################
[tool.versioningit.vcs]
method = "git"
default-tag = "0.0.1"
# Only release tags (v1, v2.3, v2.10.0rc1, ...) are version candidates. Without
# this, `git describe` (and thus versioningit) would pick up ANY tag at HEAD --
# including the lightweight coordination tags the agentic workflow pushes
# (qa/*, review/*, triage/*, analysis/*). A non-PEP440 tag like qa/cd-dialog-resize
# then raises InvalidVersionError at build/env-prep time (looks like a "test infra"
# failure). The match glob makes versioningit ignore every non-release tag.
match = ["v[0-9]*"]

[tool.versioningit.next-version]
# "minor" bumps (e.g. v2.9.0rc1) -> next_version (e.g. 2.10.0) which drops the rc
# "minor-release" would only strip the rc -> 2.9.0, which sorts LOWER.
method = "minor"

# Dev builds MUST be derived from {next_version}, not the raw {version} tag
# so `lr_reduction = {version="*"}` in the pixi-deploy env would never deploy
# appending {vcs}{rev} keeps the git hash for provenance.
[tool.versioningit.format]
distance = "{next_version}.dev{committer_date:%Y%m%d%H%M%S}+{vcs}{rev}"
dirty = "{version}"
distance-dirty = "{next_version}.dev{committer_date:%Y%m%d%H%M%S}+{vcs}{rev}"

[tool.versioningit.write]
file = "src/lr_reduction/_version.py"

####################################################################
#  CREATING CONDA ENVIRONMENT AND BUILDING CONDA PACKAGE WITH PIXI
####################################################################
[tool.pixi.workspace]
preview = ["pixi-build"]
channels = [
  "conda-forge",
  "mantid",
  "neutrons",
  "https://prefix.dev/pixi-build-backends"
]
platforms = ["linux-64"]  # add additional platforms as needed

# Conda packages to be installed in the environments. Includes all the run-dependencies.
[tool.pixi.dependencies]
argcomplete = ">=3.6.2,<4"
hatchling = ">=1.27.0,<2"
spyder = ">=6.1.4,<7"
#   run-dependiencies replicated here
python = ">=3.11"
lmfit = ">=1.3.0,<1.4.0"
mantid = ">=6.14.0,<6.15"
matplotlib = ">=3.9.4,<4"
plot-publisher = ">=1.0,<2.0"
pyqt = ">=5,<6"
qtpy = ">=2.4.3"
periodictable = ">=1.7.1,<2"
sympy = ">=1.14.0,<2"

# Pypi packages to be installed in the environments with `pip`
[tool.pixi.pypi-dependencies]
lr_reduction = { path = ".", editable = true }  # editable install of lr_reduction
toml-cli = "*"

# Conda packages (no PyPi) to be enumerated within the conda package to be built.
[tool.pixi.package.run-dependencies]
python = ">=3.11"
lmfit = ">=1.3.0,<1.4.0"
mantid = ">=6.14.0,<6.15"
matplotlib = "==3.9.4"
plot-publisher = ">=1.0,<2.0"
pyqt = ">=5,<6"
qtpy = ">=2.4.3"
periodictable = ">=1.7.1,<2"
sympy = ">=1.14.0,<2"

[tool.pixi.package]
name = "lr_reduction"
version = "0.0.0"  # a placeholder overwritten when Pixi task "sync-version" is executed

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = ">=0.2,<1" }

[tool.pixi.package.host-dependencies]
hatchling = { version = ">=1.27.0,<2" }
versioningit = { version = "*" }


###################################
#  PIXI FEATURES AND ENVIRONMENTS
###################################
[tool.pixi.feature.installer.dependencies]  # necessary to install and inspect
hatch= "*"
pip = "*"
versioningit = "*"
conda-tree = "*"

[tool.pixi.feature.developer.dependencies]  # necessary for development and testing
pre-commit = "*"
ruff = "*"
codecov = "*"
pytest = "*"
pytest-cov = "*"
pytest-timeout = ">=2.4.0,<3"

[tool.pixi.feature.package.dependencies]  # necessary to build the conda package
anaconda-client = ">=1.13.0,<2"

[tool.pixi.feature.docs.dependencies]  # necessary for building the documentation
sphinx = "*"
sphinx_rtd_theme = "*"
myst-parser = "*"

[tool.pixi.environments]
default = {features = ["installer", "developer", "package", "docs"], solve-group = "default"}  # created by `pixi install`
docs = {features = ["installer", "docs"], solve-group = "default"}  # readthedocs.org uses this environment

###############
#  PIXI TASKS
###############

[tool.pixi.tasks]
# Documentation
docs-build = { cmd = 'sphinx-build --keep-going -n -T -b html docs  docs/build/html && echo -e "##########\n DOCS point your browser to file://$(pwd)/build/html/index.html\n##########"', description = "Build the documentation" }
docs-clean = { cmd = "rm -rf docs/build", description = "Clean the documentation build artifacts" }
# Packaging
conda-builder = { cmd = "pixi build", description = "Command that creates the conda package" }
conda-build = { depends-on = ["sync-version", "conda-builder", "reset-version"], description = "Build the conda package" }
conda-clean = { cmd = "rm -f *.conda", description = "Clean the local .conda build artifacts" }
# Testing
test-reduction = { cmd = "cd tests/ && python -m pytest -vv --cov=../src --cov-report=xml --cov-report=term", depends-on = ["test-launcher"]}
test-launcher = { cmd = "python -m pytest -vv --timeout=120 --timeout-method=thread launcher/tests/", description = "Run launcher UI tests (headless Qt)" }
# Misc
clean-all = { description = "Clean all build artifacts", depends-on = ["docs-clean", "conda-clean"] }
sync-version = { cmd = 'version=$(python -m versioningit); toml set tool.pixi.package.version "$version" --toml-path pyproject.toml', description = "Sync pyproject.toml version with Git version" }
reset-version = { cmd = "toml set tool.pixi.package.version \"0.0.0\" --toml-path pyproject.toml", description = "Reset the package version to 0.0.0" }

#############
#  COVERAGE
#############
[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_empty = true

###########
#  PYTEST
###########
[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src",
  "scripts",
  "tests/data/liquidsreflectometer-data/nexus/",
]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  "tmp*",
  "_tmp*",
  "__pycache__",
  "*dataset*",
  "*data_set*",
]
markers = [
  "datarepo: mark a test as using LiquidsReflectometer-data repository",
  "scripts: mark a test as a script that should be run manually",
]
addopts = "--import-mode=importlib"  # to allow a unit test and integration test with the same module name

#########
#  RUFF
#########
[tool.ruff]
line-length = 120
exclude = ["notebooks/**", "**/*.ipynb", "scripts/**", "tests/data/**"]

[tool.ruff.lint]
select = ["A", "ARG","ASYNC","BLE", "E", "F", "FURB", "I", "N", "UP032", "W"]
ignore = [
  "E402", # module level import not at top of file
  "E501", # line too long
  "E722", # bare except
  "E741",
  "E743", # ambiguous function name, generally 'l'
  "F403", # wild imports
  "F405",
  "F821", # unknown names from probably from wild imports
  "N802", # function should be lowercase
  "N803", # argument should be lowercase
  "N806", # variable should be lowercase
  "N812", # version should be lowercase
  "N815", # mixed case variable in class scope
  "N999", # invalid module name
]

[tool.ruff.lint.per-file-ignores]
# The launcher GUI's pervasive `except Exception:` handlers are its
# deliberate error-boundary idiom (Qt slots/callbacks must not raise;
# failures surface as dialogs/log lines instead of crashing the app) —
# 303 pre-existing sites as of 2026-08-17. BLE001 stays enforced for
# the library code under src/, where the few blind excepts carry
# per-line noqa with the reason.
"launcher/**" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["lr_reduction"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
